<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-label="FRIDAY OS architecture diagram">
  <title>FRIDAY OS — Architecture</title>
  <defs>
    <linearGradient id="hudG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#7c9dff"/>
    </linearGradient>
    <linearGradient id="flowG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7fe6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>

    <style><![CDATA[
      .txt      { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .lbl      { font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; }

      /* data travelling along the wires */
      .flow     { stroke-dasharray: 7 13; animation: flow 1.9s linear infinite; }
      .flow.s2  { animation-duration: 2.5s; animation-delay:-.4s; }
      .flow.s3  { animation-duration: 3.1s; animation-delay:-.9s; }
      .flow.back{ animation-direction: reverse; animation-duration: 2.3s; }
      @keyframes flow { to { stroke-dashoffset: -80; } }

      /* soft node breathing */
      .n1 { animation: br 4.4s ease-in-out infinite; }
      .n2 { animation: br 4.4s ease-in-out infinite; animation-delay:-1.1s; }
      .n3 { animation: br 4.4s ease-in-out infinite; animation-delay:-2.2s; }
      .n4 { animation: br 4.4s ease-in-out infinite; animation-delay:-3.3s; }
      @keyframes br { 0%,100% { opacity:.82; } 50% { opacity:1; } }

      /* the HUD core pulse */
      .core { animation: cp 3s ease-in-out infinite; }
      @keyframes cp { 0%,100% { opacity:.55; } 50% { opacity:1; } }

      .ring { animation: rr 9s linear infinite; transform-origin: 580px 74px; }
      @keyframes rr { from { transform: rotate(0); } to { transform: rotate(360deg); } }

      .dash { stroke-dasharray: 5 9; animation: march 3.6s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -70; } }

      .blip { animation: bl 2.4s steps(1,end) infinite; }
      .blip.b2 { animation-delay:-.8s; }
      .blip.b3 { animation-delay:-1.6s; }
      @keyframes bl { 0%,50% { opacity:1; } 51%,100% { opacity:.2; } }

      @media (prefers-reduced-motion: reduce) {
        .flow,.n1,.n2,.n3,.n4,.core,.ring,.dash,.blip { animation:none !important; }
      }
    ]]></style>
  </defs>

  <rect width="1160" height="620" fill="#0a0a1a"/>

  <!-- ================= HUD (top) ================= -->
  <g class="n1">
    <rect x="330" y="34" width="500" height="80" rx="12"
          fill="#0d1a2c" stroke="url(#hudG)" stroke-width="1.8"/>
    <circle class="core" cx="376" cy="74" r="15" fill="#00d4ff" opacity="0.8"/>
    <circle cx="376" cy="74" r="6" fill="#ffffff" opacity="0.95"/>
    <circle class="ring" cx="580" cy="74" r="0" fill="none" stroke="none"/>
    <text class="lbl" x="410" y="70" font-size="21" font-weight="700"
          fill="#00d4ff" letter-spacing="2.6">FRIDAY OS HUD</text>
    <text class="txt" x="412" y="93" font-size="12.5" fill="#7f9ac0">
      67 ES modules &#183; PWA &#183; service worker &#183; offline-first</text>
  </g>

  <!-- wires: HUD -> three columns -->
  <g stroke="#1d4b6e" stroke-width="1.4" fill="none">
    <path d="M580 114 V150"/>
    <path d="M180 150 H980"/>
    <path d="M180 150 V196"/>
    <path d="M580 150 V196"/>
    <path d="M980 150 V196"/>
  </g>
  <g stroke="url(#flowG)" stroke-width="2.6" fill="none">
    <path class="flow"      d="M580 114 V150 H180 V196"/>
    <path class="flow s2"   d="M580 114 V150 V196"/>
    <path class="flow s3"   d="M580 114 V150 H980 V196"/>
    <path class="flow back" d="M180 196 V150 H580"/>
  </g>

  <!-- ================= three columns ================= -->
  <!-- col 1: local engines -->
  <g class="n2">
    <rect x="34" y="196" width="292" height="196" rx="12"
          fill="#101d2e" stroke="#2b6ea8" stroke-width="1.5"/>
    <text class="lbl" x="58" y="228" font-size="16" font-weight="700"
          fill="#7fd8ff" letter-spacing="1.8">LOCAL ENGINES</text>
    <path class="dash" d="M58 240 H302" stroke="#2b6ea8" stroke-width="1"/>
    <g class="txt" font-size="13" fill="#93aecd">
      <text x="58" y="268">&#183; llama.cpp &#8212; local LLM</text>
      <text x="58" y="292">&#183; Vosk / Sherpa STT</text>
      <text x="58" y="316">&#183; wake-word engine</text>
      <text x="58" y="340">&#183; embeddings</text>
      <text x="58" y="364">&#183; 188 offline skills</text>
    </g>
  </g>

  <!-- col 2: capacitor + native -->
  <g class="n3">
    <rect x="434" y="196" width="292" height="196" rx="12"
          fill="#101d2e" stroke="#2b6ea8" stroke-width="1.5"/>
    <text class="lbl" x="458" y="228" font-size="16" font-weight="700"
          fill="#7fd8ff" letter-spacing="1.8">CAPACITOR BRIDGE</text>
    <path class="dash" d="M458 240 H702" stroke="#2b6ea8" stroke-width="1"/>
    <g class="txt" font-size="13" fill="#93aecd">
      <text x="458" y="268">www/js/native.js</text>
      <text x="458" y="292">&#8595; 29 Java classes</text>
      <text x="458" y="316">14,600 LOC native layer</text>
      <text x="458" y="340">&#183; services &amp; receivers</text>
      <text x="458" y="364">&#183; manifest patching</text>
    </g>
  </g>

  <!-- col 3: backend -->
  <g class="n4">
    <rect x="834" y="196" width="292" height="196" rx="12"
          fill="#101d2e" stroke="#2b6ea8" stroke-width="1.5"/>
    <text class="lbl" x="858" y="228" font-size="16" font-weight="700"
          fill="#7fd8ff" letter-spacing="1.8">BACKEND (OPTIONAL)</text>
    <path class="dash" d="M858 240 H1102" stroke="#2b6ea8" stroke-width="1"/>
    <g class="txt" font-size="13" fill="#93aecd">
      <text x="858" y="268">FastAPI &#183; /v1/chat</text>
      <text x="858" y="292">/v1/stt &#183; /v1/tts</text>
      <text x="858" y="316">/v1/vision &#183; /v1/memory</text>
      <text x="858" y="340">SQLite action queue</text>
      <text x="858" y="364">leases &#183; confirmations</text>
    </g>
  </g>

  <!-- wires down -->
  <g stroke="#1d4b6e" stroke-width="1.4" fill="none">
    <path d="M180 392 V438"/>
    <path d="M580 392 V438"/>
    <path d="M980 392 V438"/>
  </g>
  <g stroke="url(#flowG)" stroke-width="2.6" fill="none">
    <path class="flow s2"   d="M580 392 V438"/>
    <path class="flow"      d="M180 392 V438"/>
    <path class="flow s3"   d="M980 392 V438"/>
  </g>

  <!-- ================= bottom row ================= -->
  <!-- android system -->
  <g class="n3">
    <rect x="34" y="438" width="292" height="146" rx="12"
          fill="#0f2318" stroke="#2f8f5b" stroke-width="1.5"/>
    <text class="lbl" x="58" y="470" font-size="16" font-weight="700"
          fill="#5fd39a" letter-spacing="1.8">ANDROID SYSTEM</text>
    <path class="dash" d="M58 482 H302" stroke="#2f8f5b" stroke-width="1"/>
    <g class="txt" font-size="13" fill="#8fc7ab">
      <text x="58" y="510">torch &#183; volume &#183; brightness</text>
      <text x="58" y="534">wifi &#183; bluetooth &#183; media</text>
      <text x="58" y="558">alarms &#183; SMS &#183; calls</text>
      <text x="58" y="582">sensors &#183; Health Connect</text>
    </g>
  </g>

  <!-- action protocol -->
  <g class="n2">
    <rect x="434" y="438" width="292" height="146" rx="12"
          fill="#241a0e" stroke="#c8892f" stroke-width="1.5"/>
    <text class="lbl" x="458" y="470" font-size="16" font-weight="700"
          fill="#f0b95c" letter-spacing="1.8">ACTION PROTOCOL</text>
    <path class="dash" d="M458 482 H702" stroke="#c8892f" stroke-width="1"/>
    <g class="txt" font-size="13" fill="#d9bb8c">
      <text x="458" y="510">15 typed actions</text>
      <text x="458" y="534">3 safety tiers</text>
      <text x="458" y="558">confirm &#183; claim &#183; lease</text>
      <text x="458" y="582">verified / unverified</text>
    </g>
  </g>

  <!-- cloud -->
  <g class="n4">
    <rect x="834" y="438" width="292" height="146" rx="12"
          fill="#1a1130" stroke="#7b4fd0" stroke-width="1.5"/>
    <text class="lbl" x="858" y="470" font-size="16" font-weight="700"
          fill="#b48cff" letter-spacing="1.8">OPTIONAL CLOUD</text>
    <path class="dash" d="M858 482 H1102" stroke="#7b4fd0" stroke-width="1"/>
    <g class="txt" font-size="13" fill="#b9a6e0">
      <text x="858" y="510">Groq</text>
      <text x="858" y="534">Blackbox (disabled)</text>
      <text x="858" y="558">keys stay server-side</text>
      <text x="858" y="582">never in the client</text>
    </g>
  </g>

  <!-- status LEDs -->
  <g>
    <circle class="blip"    cx="304" cy="212" r="4.2" fill="#00d4ff"/>
    <circle class="blip b2" cx="704" cy="212" r="4.2" fill="#00d4ff"/>
    <circle class="blip b3" cx="1104" cy="212" r="4.2" fill="#00d4ff"/>
    <circle class="blip b2" cx="304" cy="454" r="4.2" fill="#5fd39a"/>
    <circle class="blip"    cx="704" cy="454" r="4.2" fill="#f0b95c"/>
    <circle class="blip b3" cx="1104" cy="454" r="4.2" fill="#b48cff"/>
  </g>

  <!-- footer note -->
  <text class="txt" x="580" y="612" font-size="11.5" fill="#4c6079" text-anchor="middle">
    every layer degrades gracefully &#8212; no cloud, no backend, still fully functional
  </text>
</svg>
