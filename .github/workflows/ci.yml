name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-tests:
    name: Web tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run web test suite
        run: npm run test:web

  backend-tests:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend test suite
        run: python -m unittest discover -s backend -p 'test_*.py' -v

  syntax-check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: python -m compileall -q backend tools native

      - name: JavaScript syntax
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find www/js -name '*.js')
          exit $fail

      - name: JSON validity
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('all JSON valid')
          PY

      - name: SVG validity
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          bad = []
          for p in pathlib.Path('docs').rglob('*.svg') if pathlib.Path('docs').exists() else []:
              try:
                  ET.parse(p)
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('all SVG valid')
          PY

  native-check:
    name: Native Java checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch JUnit
        run: |
          mkdir -p /tmp/libs && cd /tmp/libs
          curl -sLO https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sLO https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          mv junit-4.13.2.jar junit4.jar
          mv hamcrest-core-1.3.jar hamcrest.jar

      - name: Provision android.jar + Capacitor stubs
        run: bash tools/buildenv.sh

      - name: Compile the native layer and run its unit tests
        run: bash tools/javac-check.sh

  android-build:
    name: Android APK assembles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JS dependencies
        run: npm ci --include=dev

      - name: Generate the Capacitor Android project
        run: npx --yes @capacitor/cli add android

      - name: Install native sources, resources and dependencies
        run: |
          PKG_DIR="android/app/src/main/java/com/rishu/fridayos"
          mkdir -p "$PKG_DIR" android/app/src/main/java/com
          cp native/*.java "$PKG_DIR/"
          TEST_PKG_DIR="android/app/src/test/java/com/rishu/fridayos"
          mkdir -p "$TEST_PKG_DIR"
          cp native/tests/*.java "$TEST_PKG_DIR/"
          cp -r native/vendor/sherpa/com/k2fsa android/app/src/main/java/com/
          mkdir -p android/app/src/main/res/xml \
                   android/app/src/main/res/layout \
                   android/app/src/main/res/drawable \
                   android/app/src/main/res/raw
          cp native/friday_accessibility.xml android/app/src/main/res/xml/
          cp native/res/xml/*.xml android/app/src/main/res/xml/
          cp native/res/layout/friday_widget.xml android/app/src/main/res/layout/
          cp native/res/drawable/*.xml android/app/src/main/res/drawable/
          cp native/res/raw/keep.xml android/app/src/main/res/raw/
          cp native/proguard-rules.pro android/app/proguard-rules.pro
          python3 native/register_plugin.py
          python3 native/patch_manifest.py
          python3 native/add_llama_dep.py
          python3 native/add_sherpa_dep.py

      - name: Fail-fast gate on the generated project
        run: python3 native/validate_android.py

      - name: Run the native unit tests through Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Confirm the APK actually exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: friday-os-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        run: |
          echo "Scanning full history for provider key patterns..."
          if git log --all -p | grep -nE '(gsk_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{24,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'; then
            echo "::error::Potential secret detected in git history. Rotate the key and purge it."
            exit 1
          fi
          echo "No secrets detected."

      - name: Verify no populated .env is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A populated .env file is tracked. Remove it immediately."
            exit 1
          fi
          echo "No .env tracked."
