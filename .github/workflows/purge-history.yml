name: Purge leaked .env from git history

# ─────────────────────────────────────────────────────────────────────────────
#  ONE-TIME MAINTENANCE WORKFLOW — this is the only file you need to upload.
#
#  What it does:
#    1. Checks out your repo WITH full history
#    2. Removes the leaked .env file from EVERY commit
#    3. Verifies the removal
#    4. Force-pushes the cleaned history back to GitHub
#    5. Deletes itself, so it can never be run again
#
#  Your FILES DO NOT CHANGE. Only the commit history is rewritten.
#
#  HOW TO USE  →  see PURGE-VIA-GITHUB.md
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PURGE (uppercase) — confirms you have already rotated the keys'
        required: true
        type: string

# Needed to force-push the rewritten history
permissions:
  contents: write

jobs:
  purge:
    name: Remove .env from history and force-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Guard: never run by accident ────────────────────────────────────────
      - name: Validate confirmation
        env:
          # Passed via env, never interpolated into the script — prevents
          # shell-injection through the workflow_dispatch input.
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PURGE" ]; then
            echo "::error::Confirmation failed. You typed '$CONFIRM', expected exactly PURGE."
            echo "Nothing was changed. Re-run the workflow and type PURGE."
            exit 1
          fi
          echo "Confirmation OK — proceeding."

      # ── Get the full history ────────────────────────────────────────────────
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Show the problem before fixing it ───────────────────────────────────
      - name: Report what will be removed
        run: |
          echo "Commits in history : $(git rev-list --count HEAD)"
          echo
          echo "Commits containing .env:"
          found=0
          for c in $(git rev-list --all); do
            if git ls-tree -r "$c" --name-only 2>/dev/null | grep -qx '.env'; then
              echo "  ${c:0:8}  $(git log -1 --format=%s "$c")"
              found=$((found + 1))
            fi
          done
          echo "  → $found commit(s) affected"
          echo
          echo ".env blob objects:"
          git rev-list --all --objects | awk '$2==".env" {print "  "$1}'
          echo
          if [ "$found" -eq 0 ]; then
            echo "::notice::No .env found in history — nothing to purge. Safe to delete this workflow."
            exit 0
          fi

      # ── Do the purge ────────────────────────────────────────────────────────
      - name: Install git-filter-repo
        run: pip install --quiet --disable-pip-version-check git-filter-repo

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remove .env from all commits
        run: |
          git filter-repo \
            --invert-paths \
            --path .env \
            --path-glob '*/.env' \
            --force
          echo "History rewritten."

      # ── Prove it worked before pushing anything ─────────────────────────────
      - name: Verify .env is gone
        run: |
          remaining=$(git rev-list --all --objects | awk '$2==".env"' | wc -l | tr -d ' ')
          echo "Remaining .env objects: $remaining"
          if [ "$remaining" -ne 0 ]; then
            echo "::error::.env still present in $remaining object(s) — aborting before push."
            exit 1
          fi
          echo "✓ .env removed from every commit"
          echo "✓ Commit count is now: $(git rev-list --count HEAD)"
          echo "✓ HEAD tree hash: $(git rev-parse HEAD^{tree})"

      # ── Push the cleaned history ────────────────────────────────────────────
      - name: Force-push cleaned history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:${GITHUB_REF_NAME}"
          echo "✓ Clean history pushed to ${GITHUB_REF_NAME}"

      # ── Remove this workflow so it can never run again ──────────────────────
      - name: Delete this workflow file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rm --quiet .github/workflows/purge-history.yml
          git commit --quiet -m "chore: remove one-time secret-purge workflow (leaked .env purged from all history)"
          git push --quiet origin "HEAD:${GITHUB_REF_NAME}"
          echo "✓ Workflow removed — it cannot be re-run."

      # ── Friendly summary in the Actions UI ──────────────────────────────────
      - name: Summary
        if: always()
        run: |
          {
            echo "## ✅ Git history purged"
            echo ""
            echo "The leaked \`.env\` file has been removed from every commit and the"
            echo "cleaned history has been force-pushed."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Rewritten by | \`git-filter-repo\` |"
            echo "| Files changed | **none** — only history was rewritten |"
            echo "| This workflow | self-deleted |"
            echo ""
            echo "### Next steps"
            echo "1. Verify: \`git clone\` the repo fresh and run"
            echo "   \`git log --all -p | grep -c gsk_\` — should print \`0\`."
            echo "2. If the repo was **ever public**, email support@github.com to"
            echo "   purge GitHub's cached views of the old commits."
            echo "3. Enable **Secret scanning + Push protection** in"
            echo "   Settings → Code security."
          } >> "$GITHUB_STEP_SUMMARY"
