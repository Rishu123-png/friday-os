
workflows:
  friday-android:
    name: FRIDAY OS — Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 20
      java: 17
      vars:
        PACKAGE_NAME: "com.rishu.fridayos"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Create Android platform
        script: |
          if [ ! -d "android" ]; then npx cap add android; fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Copy web assets into native project
        script: npx cap sync android

      - name: Install native Java sources
        script: |
          PKG_DIR="android/app/src/main/java/com/rishu/fridayos"
          mkdir -p "$PKG_DIR"
          cp native/*.java "$PKG_DIR/"
          echo "Installed:"; ls -1 "$PKG_DIR"

      - name: Add accessibility service config
        script: |
          mkdir -p android/app/src/main/res/xml
          cp native/friday_accessibility.xml android/app/src/main/res/xml/
          cat android/app/src/main/res/xml/friday_accessibility.xml

      - name: Register plugin with Capacitor
        script: python3 native/register_plugin.py

      - name: Patch AndroidManifest
        script: python3 native/patch_manifest.py

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

    artifacts:
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - CHANGE_ME@example.com
        notify:
          success: true
          failure: true
