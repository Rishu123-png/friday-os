workflows:
  friday-android:
    name: FRIDAY OS - Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 17
      vars:
        PACKAGE_NAME: "com.rishu.fridayos"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Install locked dependencies
        script: |
          npm ci
          python3 -m pip install --user --disable-pip-version-check "httpx>=0.27"

      - name: Run complete Phase 3 test suite
        script: npm test

      - name: Verify Java 17 and Android SDK 34
        script: |
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '[".]' '/version/ {print $2}')
          test "$JAVA_MAJOR" = "17" || { echo "Java 17 required"; exit 1; }
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          test -d "$SDK" || { echo "Android SDK not found: $SDK"; exit 1; }
          SDKMANAGER=$(command -v sdkmanager || find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_SDK=$SDK"

      - name: Generate Capacitor Android project and sync Phase 3 assets
        script: |
          test "$(node -p "require('./capacitor.config.json').appId")" = "$PACKAGE_NAME"
          if [ ! -d android ]; then npx cap add android; fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          echo "sdk.dir=$SDK" > android/local.properties
          npx cap sync android

      - name: Install native sources, resources, and build dependencies
        script: |
          PKG_DIR="android/app/src/main/java/com/rishu/fridayos"
          mkdir -p "$PKG_DIR" android/app/src/main/java/com
          cp native/*.java "$PKG_DIR/"
          cp -r native/vendor/sherpa/com/k2fsa android/app/src/main/java/com/
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/layout android/app/src/main/res/drawable android/app/src/main/res/raw
          cp native/friday_accessibility.xml android/app/src/main/res/xml/
          cp native/res/xml/friday_widget_info.xml native/res/xml/file_paths.xml android/app/src/main/res/xml/
          cp native/res/layout/friday_widget.xml android/app/src/main/res/layout/
          cp native/res/drawable/*.xml android/app/src/main/res/drawable/
          cp native/res/raw/keep.xml android/app/src/main/res/raw/
          cp native/proguard-rules.pro android/app/proguard-rules.pro
          python3 native/register_plugin.py
          python3 native/patch_manifest.py
          python3 native/add_llama_dep.py
          # Native JNI build dependency only; this does not package or download a user model.
          python3 native/add_sherpa_dep.py

      - name: Validate generated Android project
        script: python3 native/validate_android.py

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - adminschool8@gmail.com
        notify:
          success: true
          failure: true

  friday-release:
    name: FRIDAY OS - Signed Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 17
      android_signing:
        - friday_keystore
      vars:
        PACKAGE_NAME: "com.rishu.fridayos"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Install locked dependencies
        script: |
          npm ci
          python3 -m pip install --user --disable-pip-version-check "httpx>=0.27"

      - name: Run complete Phase 3 test suite
        script: npm test

      - name: Verify Java 17 and Android SDK 34
        script: |
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '[".]' '/version/ {print $2}')
          test "$JAVA_MAJOR" = "17" || { echo "Java 17 required"; exit 1; }
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          test -d "$SDK" || { echo "Android SDK not found: $SDK"; exit 1; }
          SDKMANAGER=$(command -v sdkmanager || find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate Capacitor Android project and sync Phase 3 assets
        script: |
          test "$(node -p "require('./capacitor.config.json').appId")" = "$PACKAGE_NAME"
          if [ ! -d android ]; then npx cap add android; fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          echo "sdk.dir=$SDK" > android/local.properties
          npx cap sync android

      - name: Install native sources, resources, and build dependencies
        script: |
          PKG_DIR="android/app/src/main/java/com/rishu/fridayos"
          mkdir -p "$PKG_DIR" android/app/src/main/java/com
          cp native/*.java "$PKG_DIR/"
          cp -r native/vendor/sherpa/com/k2fsa android/app/src/main/java/com/
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/layout android/app/src/main/res/drawable android/app/src/main/res/raw
          cp native/friday_accessibility.xml android/app/src/main/res/xml/
          cp native/res/xml/friday_widget_info.xml native/res/xml/file_paths.xml android/app/src/main/res/xml/
          cp native/res/layout/friday_widget.xml android/app/src/main/res/layout/
