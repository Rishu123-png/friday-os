          python3 native/add_sherpa_dep.py

      - name: Validate Phase 3 Android project and configure signing
        script: |
          python3 native/validate_android.py
          python3 native/configure_release.py

      - name: Build signed release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

    artifacts:
