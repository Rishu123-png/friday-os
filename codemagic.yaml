workflows:
  friday-android:
    name: FRIDAY OS — Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 20
      java: 21

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Add Android platform if missing
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Point Gradle at the Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Inject permissions into AndroidManifest
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re, io, os
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = [
            "android.permission.INTERNET",
            "android.permission.RECORD_AUDIO",
            "android.permission.CAMERA",
            "android.permission.VIBRATE",
            "android.permission.ACCESS_FINE_LOCATION",
            "android.permission.ACCESS_COARSE_LOCATION",
            "android.permission.POST_NOTIFICATIONS",
            "android.permission.SCHEDULE_EXACT_ALARM",
            "android.permission.USE_EXACT_ALARM",
            "android.permission.FOREGROUND_SERVICE",
            "android.permission.RECEIVE_BOOT_COMPLETED",
            "android.permission.WAKE_LOCK",
            "android.permission.CALL_PHONE",
            "android.permission.READ_CONTACTS",
            "android.permission.SEND_SMS",
            "android.permission.FLASHLIGHT",
            "android.permission.MODIFY_AUDIO_SETTINGS",
            "android.permission.QUERY_ALL_PACKAGES",
          ]
          add = ""
          for perm in perms:
              if perm not in s:
                  add += '    <uses-permission android:name="%s"/>\n' % perm
          feats = '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n'
          if "android.hardware.camera" not in s:
              add += feats
          if add:
              s = s.replace("<application", add + "\n    <application", 1)
          # allow tel:/sms:/whatsapp intents to resolve
          if "<queries>" not in s:
              q = """    <queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
              </queries>
          """
              s = s.replace("<application", q + "\n    <application", 1)
          open(p, "w").write(s)
          print("Manifest patched")
          PY
          cat $MANIFEST | head -40

      - name: Sync web assets into the native project
        script: |
          npx cap sync android

      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - CHANGE_ME@example.com
        notify:
          success: true
          failure: true
